[package]
name = "velowa-wasm-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin wasm-bindgen bridge exposing the vendored wacore-{binary,libsignal,noise,appstate} crates to src/"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wacore-binary = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
