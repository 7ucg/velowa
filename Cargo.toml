[workspace]
resolver = "2"
members = [
    "rust/wasm-bridge",
    "rust/wacore-derive",
    "rust/wacore-binary",
    "rust/waproto",
    "rust/wacore-libsignal",
    "rust/wacore-noise",
    "rust/wacore-appstate",
    "rust/wacore-voip",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/7ucg/velowa"

# wasm-bindgen output is size-sensitive — optimize for size, not speed.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace.dependencies]
wacore-derive = { path = "rust/wacore-derive" }
wacore-binary = { path = "rust/wacore-binary", default-features = false }
wacore-libsignal = { path = "rust/wacore-libsignal" }
wacore-noise = { path = "rust/wacore-noise" }
wacore-appstate = { path = "rust/wacore-appstate" }
waproto = { path = "rust/waproto" }
wacore-voip = { path = "rust/wacore-voip" }
# Generic (non-WhatsApp) crates only; versions copied from whatsapp-rust's
# workspace at vendoring time, now owned and bumped here.
bytes = { version = "1.12", default-features = false }
compact_str = { version = "0.10", default-features = false }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
itoa = "1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", default-features = false }
smallvec = "1.15"
smoothutf8 = { version = "0.2.3", default-features = false }
yoke = { version = "0.8", features = ["derive"] }
aes = "0.9.2"
anyhow = { version = "1.0", default-features = false }
async-lock = { version = "3", default-features = false }
async-trait = "0.1.91"
buffa = { version = "0.9.2", default-features = false, features = ["json"] }
buffa-build = { version = "0.9.2", default-features = false }
buffa-descriptor = { version = "0.9.2", default-features = false }
cbc = { version = "0.2", features = ["alloc"] }
chrono = { version = "0.4", default-features = false }
ctr = { version = "0.10", default-features = false }
getrandom = { version = "0.4", default-features = false }
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
heck = "0.5"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
log = "0.4"
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }
rand = "0.10"
serde-big-array = "0.5"
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
subtle = { version = "2.6", default-features = false }
thiserror = "2.0.19"
zlib-rs = { version = "0.6.6", default-features = false, features = ["std", "rust-allocator"] }

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
print_stderr = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
unused_qualifications = "warn"
